[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-speech"
version = "0.1.0"
description = "A memory-augmented semantic and acoustic speech generation research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30",
    "moshi>=0.2.13",
    "numpy>=2",
    "onnxruntime-gpu>=1.22",
    "piper-tts>=1.8",
    "pyarrow>=18",
    "safetensors>=0.4",
    "scipy>=1.14",
    "soundfile>=0.12",
    "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
